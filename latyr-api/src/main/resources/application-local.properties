# Local Development Profile Properties
server.port=8080

# PostgreSQL Local Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:latyr_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Clean & Quiet Logging Levels
logging.level.root=INFO
logging.level.com.latyr.api=INFO
logging.level.com.latyr.api.mapper=WARN
logging.level.org.springframework.web=INFO
logging.level.org.mybatis=WARN

# Queue Polling Interval (in milliseconds)
latyr.queue.poll-interval-ms=2000

# Google GenAI (Agent Platform / Vertex AI with com.google.genai SDK)
google.genai.api-key=${GEMINI_API_KEY:}
firebase.config.path=${FIREBASE_CONFIG_PATH:}
google.genai.project-id=${GCP_PROJECT_ID:}
google.genai.location=${GCP_LOCATION:us-central1}
google.genai.model.name=${GOOGLE_GENAI_MODEL_NAME:gemini-2.5-flash}

# Third-Party Integrations
apify.api.token=${APIFY_API_TOKEN:}
revenuecat.webhook.secret=${REVENUECAT_WEBHOOK_SECRET:rc_webhook_secret_dev_123}
