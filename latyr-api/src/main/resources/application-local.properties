# Local Development Profile Properties
server.port=8080

# PostgreSQL Local Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/latyr_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Logging Levels
logging.level.com.latyr.api=DEBUG
logging.level.com.latyr.api.mapper=TRACE
logging.level.org.springframework.web=INFO

# Firebase Local Mock Auth
firebase.auth.mock-enabled=true
