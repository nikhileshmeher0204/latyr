# Local Development Profile Properties
server.port=8080

# PostgreSQL Local Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:latyr_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Logging Levels
logging.level.com.latyr.api=DEBUG
logging.level.com.latyr.api.mapper=TRACE
logging.level.org.springframework.web=INFO

# Google GenAI & Firebase
firebase.config.path=${FIREBASE_CONFIG_PATH:}
google.genai.project-id=${GCP_PROJECT_ID:latyr-prod}
google.genai.location=${GCP_LOCATION:us-central1}
google.genai.model.name=${GOOGLE_GENAI_MODEL_NAME:gemini-1.5-flash}

# Third-Party Integrations
apify.api.token=${APIFY_API_TOKEN:}
revenuecat.webhook.secret=${REVENUECAT_WEBHOOK_SECRET:rc_webhook_secret_dev_123}
