# Production Profile Configuration
spring.application.name=latyr-api
server.port=8080

# PostgreSQL Production Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:latyr_prod_db}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.root=WARN
logging.level.com.latyr=INFO
logging.level.org.springframework.web=WARN

# Google GenAI & Firebase
firebase.config.path=${FIREBASE_CONFIG_PATH}
google.genai.project-id=${GCP_PROJECT_ID}
google.genai.location=${GCP_LOCATION:us-central1}
google.genai.model.name=${GOOGLE_GENAI_MODEL_NAME:gemini-1.5-flash}

# Third-Party Integrations
apify.api.token=${APIFY_API_TOKEN}
revenuecat.webhook.secret=${REVENUECAT_WEBHOOK_SECRET}
