# UAT Profile Configuration (User Acceptance Testing)
spring.application.name=latyr-api
server.port=8080

# PostgreSQL UAT Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:latyr_uat_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.root=INFO
logging.level.com.latyr=INFO
logging.level.org.springframework.web=INFO

# External Integrations
firebase.config.path=${FIREBASE_CONFIG_PATH:}
apify.api.token=${APIFY_API_TOKEN:}
gemini.api.key=${GEMINI_API_KEY:}
tmdb.api.key=${TMDB_API_KEY:}
github.api.token=${GITHUB_API_TOKEN:}
revenuecat.webhook.secret=${REVENUECAT_WEBHOOK_SECRET:}
