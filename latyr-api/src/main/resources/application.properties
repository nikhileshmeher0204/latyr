# Master Application Properties
spring.application.name=latyr-api

# Java 21 Project Loom Virtual Threads Enabled
spring.threads.virtual.enabled=true

# Active Profile Default
spring.profiles.active=local

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30
mybatis.type-handlers-package=com.latyr.api.config.typehandler

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Servlet Multipart Upload Limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Jackson Global Serialization Strategy
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# Firebase Admin SDK Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH:}

# Google GenAI SDK Configuration
google.genai.project-id=${GCP_PROJECT_ID:latyr-prod}
google.genai.location=${GCP_LOCATION:us-central1}
google.genai.model.name=${GOOGLE_GENAI_MODEL_NAME:gemini-1.5-flash}

# Apify Actor Integration
apify.api.token=${APIFY_API_TOKEN:}

# RevenueCat Webhooks
revenuecat.webhook.secret=${REVENUECAT_WEBHOOK_SECRET:rc_webhook_secret_dev_123}

# Apify Configuration
apify.api.token=${APIFY_API_TOKEN:}
apify.api.max-concurrency=${APIFY_MAX_CONCURRENCY:1}

# TMDB (The Movie Database) Integration
latyr.enrichment.tmdb.api-key=${TMDB_API_KEY:}
latyr.enrichment.tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
latyr.enrichment.tmdb.connect-timeout-ms=${TMDB_CONNECT_TIMEOUT_MS:1500}
latyr.enrichment.tmdb.read-timeout-ms=${TMDB_READ_TIMEOUT_MS:1500}

