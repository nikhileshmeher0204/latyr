# Master Application Properties
spring.application.name=latyr-api

# Java 21 Project Loom Virtual Threads Enabled
spring.threads.virtual.enabled=true

# Active Profile Default
spring.profiles.active=local

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30
mybatis.type-handlers-package=com.latyr.api.config.typehandler

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Servlet Multipart Upload Limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Jackson Global Serialization Strategy
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# Firebase Admin SDK Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH:}
firebase.auth.mock-enabled=false
