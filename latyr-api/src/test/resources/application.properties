# Test Configuration
spring.application.name=latyr-api-test

# In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.latyr.api.config.typehandler

# Disable Flyway for unit context tests
spring.flyway.enabled=false

# Enable Firebase mock auth in test environment
firebase.auth.mock-enabled=true
